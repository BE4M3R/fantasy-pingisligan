name: Deploy database to staging

on:
  push:
    branches:
      - develop
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-staging
  cancel-in-progress: false

jobs:
  migrate:
    if: vars.DATABASE_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify the baseline is registered
        run: |
          set -o pipefail
          supabase migration list | tee migration-status.txt
          if ! grep -Eq '20260906000000.*20260906000000' migration-status.txt; then
            echo "::error::Register baseline 20260906000000 on staging before enabling deployments."
            exit 1
          fi

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push --yes

      - name: Show migration status
        run: supabase migration list
