name: Import Pingisligan results

on:
  schedule:
    # Supabase Cron dispatches match-window runs; GitHub schedules only nightly.
    - cron: "7 0 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      kind:
        description: "Full manual refresh or fixture-window results poll"
        required: false
        type: choice
        options: [full, poll]
        default: full
      slot_at:
        description: "Stockholm polling slot timestamp supplied by Supabase Cron"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: import-pingisligan-results
  cancel-in-progress: false

jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the cadence check, schedule importer and results importer aligned.
      STUPA_STAGE_ID: "5727"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check whether results are due
        id: cadence
        run: node scripts/results-refresh-schedule.mjs
        env:
          RESULTS_CRON: ${{ github.event.schedule }}
          RESULTS_DISPATCH_KIND: ${{ inputs.kind }}
          RESULTS_SLOT_AT: ${{ inputs.slot_at }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install dependencies
        if: steps.cadence.outputs.should_run == 'true'
        run: npm ci

      - name: Refresh fixtures before the daily or manual results import
        if: steps.cadence.outputs.refresh_schedule == 'true'
        run: npm run import:schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Import singles and golden doubles, score and complete the pending gameweek
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          if npm run import:results -- --complete-gameweek-refresh; then
            exit 0
          fi

          echo "Results import failed. Retrying once in 30 seconds..."
          sleep 30
          npm run import:results -- --complete-gameweek-refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
