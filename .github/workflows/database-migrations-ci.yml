name: Validate database migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/database-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Rebuild database from migrations
        run: supabase db start

      - name: Lint database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Show local migration status
        run: supabase migration list --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
