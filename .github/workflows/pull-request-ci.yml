name: Validate pull request

on:
  pull_request:
    # Re-evaluate the diff when a PR is retargeted to another base branch.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      migrations: ${{ steps.select.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: select
        run: node scripts/ci-validation.mjs changes

  code-and-unit:
    name: code-and-unit
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and run named rule and import tests
        run: npm run check
      - name: Summarize tests
        if: always()
        run: node scripts/test-summary.mjs test-results/unit/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit/
          if-no-files-found: ignore

  functional-and-browser:
    name: functional-and-browser
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start isolated local Supabase
        run: supabase start > /dev/null
      - name: Prepare local-only credentials
        run: node scripts/prepare-ci-test-env.mjs
      - name: Verify populated legacy schema upgrades
        run: node scripts/check-schema-upgrade.mjs
      - name: Lint migrated database
        run: npm run db:lint
      - name: Build application against local configuration
        run: npm run build
      - name: Run authenticated database flows
        run: npm run test:functional:db
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Summarize tests
        if: always()
        run: node scripts/test-summary.mjs test-results/functional/results.xml test-results/browser/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-results
          path: |
            test-results/functional/
            test-results/browser/
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  migration-validation:
    name: Migration validation
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/database-migrations-ci.yml

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, code-and-unit, functional-and-browser, migration-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every selected validation job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-validation.mjs gate
